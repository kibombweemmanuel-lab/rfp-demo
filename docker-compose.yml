services:
  postgres:
    image: postgres:16-alpine
    container_name: rfp-emr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rfp_emr
      POSTGRES_USER: rfp
      POSTGRES_PASSWORD: rfp_emr
    ports:
      - "5432:5432"
    volumes:
      - rfp_emr_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfp -d rfp_emr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rfp_emr_postgres:
