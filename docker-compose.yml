services:
  postgres:
    image: postgres:16-alpine
    container_name: rfp-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rfp_demo
      POSTGRES_USER: rfp
      POSTGRES_PASSWORD: rfp_demo
    ports:
      - "5432:5432"
    volumes:
      - rfp_demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfp -d rfp_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rfp_demo_postgres:
